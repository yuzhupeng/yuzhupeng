name: Deploy VitePress to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Update index stats
        run: python3 scripts/update-index-stats.py

      - name: Auto-add new docs to index
        run: python3 scripts/auto-index.py --write --auto-summary

      # 覆盖率检查不阻断构建：缺收录时 auto-index 已自动补行，这里只把
      # 「还需人工润色」的文件名打到日志里，便于事后补摘要与关键词。
      - name: Index coverage report
        run: python3 scripts/check-ci-coverage.py || true

      - name: Validate Markdown
        run: npm run docs:check

      - name: Build with VitePress
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
